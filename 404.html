<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOITpreview</title>
    <script>
      (function() {
        var redirect = sessionStorage.getItem('gh_redirect');
        if (redirect) {
          sessionStorage.removeItem('gh_redirect');
          var data = JSON.parse(redirect);
          var dest = location.origin + data.path + (data.query || '') + (data.hash || '');
          location.replace(dest);
        } else {
          var path = location.pathname.replace(/404.html$/, '');
          var search = location.search || '';
          var hash = location.hash || '';
          var base = '/DOITpreview/';
          sessionStorage.setItem('gh_redirect', JSON.stringify({ path: base, query: search, hash: hash }));
          location.replace(base);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Redirect...</noscript>
  </body>
</html>
